name: Deploy NEOMES to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'validation/**'
      - 'deployment/**'
      - 'README.md'
      - '*.md'

permissions:
  contents: write

concurrency:
  group: neomes-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar aplicação e API
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar criptografia de senha
        id: patch
        run: |
          set -euo pipefail
          node scripts/apply-cloudflare-password-crypto.mjs
          grep -q "const PASSWORD_ITERATIONS = 10000;" worker/auth.js
          grep -q "const ITERATIONS = 10000;" worker/bootstrap.js
          grep -q "NEOMES_PASSWORD_PEPPER" worker/auth.js
          grep -q "NEOMES_PASSWORD_PEPPER" worker/bootstrap.js
          grep -q "LEGACY_PASSWORD_ITERATIONS" worker/auth.js
          grep -q "automatic-on-login" worker/bootstrap.js
          node --check worker/auth.js
          node --check worker/bootstrap.js
          node --check worker/admin-user-create.js
          node --check worker/admin-password-reset.js
          node --check worker/turn-assistant.js
          node --check worker/secure-main.js

      - name: Validar aplicação
        id: validate
        run: |
          set -euo pipefail
          node --check worker/main.js
          node --check worker/index.js
          node --check app/core.js
          node --check app/operator-main.js
          node --check app/auth-shell.js
          node --check app/bootstrap-admin-ui.js
          node --check app/admin-ui.js
          node --check app/admin-password-fix.js
          node --check app/admin-password-reset-fix.js
          node --check app/admin-user-create.js
          node --check app/desktop-workspace.js
          node --check app/turn-assistant-engine.js
          node --check app/turn-assistant.js
          node --check app/turn-assistant-submit.js
          node --check app/turn-assistant-autostart.js
          node --check scripts/smoke-deployment.mjs
          node --check tests/turn-flow-v6.test.mjs
          node --check tests/turn-assistant-worker-v6.test.mjs
          node --check sw.js
          test -f app/desktop-workspace.css
          test -f app/desktop-workspace-fix.css
          test -f app/turn-assistant.css
          test -f app/turn-assistant-submit.js
          test -f .assetsignore
          node --check app/measurement-engine.js
          node --check app/measurement-frequency-parser.js
          node --check app/measurement-frequency-fix.js
          node --check app/shift-performance.js
          node --check app/shift-time-engine.js
          node --check app/shift-time-fix.js
          node tests/static-check.mjs
          node tests/password-migration.test.mjs
          node tests/measurement-plan.test.mjs
          node tests/conference-ux.test.mjs
          node tests/shift-performance.test.mjs
          node tests/shift-time.test.mjs
          node tests/turn-assistant.test.mjs
          node tests/turn-flow-v6.test.mjs
          node tests/turn-assistant-worker-v6.test.mjs

      - name: Verificar Cloudflare e D1
        id: preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          DATABASE_ID="31666c87-0970-44e1-9969-51458e7888b5"

          test -n "$TOKEN" || { echo "CLOUDFLARE_API_TOKEN ausente."; exit 1; }
          test -n "$ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID ausente."; exit 1; }

          VERIFY="$(curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.success || x.result?.status!=="active") process.exit(1)' "$VERIFY"

          DATABASE="$(curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/d1/database/$DATABASE_ID")"
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.success) process.exit(1)' "$DATABASE"

          SUBDOMAIN_RESPONSE="$(curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/subdomain")"
          SUBDOMAIN="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.result?.subdomain || "")' "$SUBDOMAIN_RESPONSE")"
          echo "subdomain=$SUBDOMAIN" >> "$GITHUB_OUTPUT"

      - name: Garantir pepper secreto
        id: pepper
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"

          SECRET_LIST="$(npx --yes wrangler@4.68.0 secret list --format json)"
          HAS_PEPPER="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.some(i=>i.name==="NEOMES_PASSWORD_PEPPER")?"yes":"no")' "$SECRET_LIST")"

          if [ "$HAS_PEPPER" = "no" ]; then
            PEPPER="$(openssl rand -hex 32)"
            printf '%s\n' "$PEPPER" | npx --yes wrangler@4.68.0 secret put NEOMES_PASSWORD_PEPPER >/dev/null
            unset PEPPER
            echo "Pepper criado e armazenado como Secret no Cloudflare."
          else
            echo "Pepper existente preservado."
          fi

      - name: Publicar no Cloudflare Workers
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKERS_SUBDOMAIN: ${{ steps.preflight.outputs.subdomain }}
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          DEPLOY_LOG="$RUNNER_TEMP/neomes-wrangler-deploy.log"

          npx --yes wrangler@4.68.0 deploy 2>&1 | tee "$DEPLOY_LOG"
          URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$DEPLOY_LOG" | tail -n 1 || true)"
          VERSION_ID="$(grep -Eo 'Current Version ID: [A-Za-z0-9-]+' "$DEPLOY_LOG" | awk '{print $4}' | tail -n 1 || true)"
          if [ -z "$URL" ] && [ -n "$WORKERS_SUBDOMAIN" ]; then
            URL="https://mes-operadores.$WORKERS_SUBDOMAIN.workers.dev"
          fi
          test -n "$URL" || { echo "Endereço do Worker não encontrado."; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"

      - name: Testar Worker publicado
        id: smoke
        env:
          DEPLOYMENT_URL: ${{ steps.publish.outputs.url }}
        run: |
          set -euo pipefail
          node scripts/smoke-deployment.mjs "$DEPLOYMENT_URL"

      - name: Registrar deploy concluído
        if: success()
        env:
          DEPLOYMENT_URL: ${{ steps.publish.outputs.url }}
          CLOUDFLARE_VERSION_ID: ${{ steps.publish.outputs.version_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- worker/auth.js worker/bootstrap.js
          git pull --rebase origin main
          mkdir -p deployment/history
          rm -f deployment/latest-failure.json
          node - <<'NODE'
          const fs=require('fs');
          const index=fs.readFileSync('index.html','utf8');
          const version=index.match(/turn-assistant\.js\?v=([^"']+)/)?.[1] || 'unknown';
          const record={
            status:'success',
            commit:process.env.GITHUB_SHA,
            workflowRun:process.env.GITHUB_RUN_ID,
            deployedAt:new Date().toISOString(),
            applicationUrl:process.env.DEPLOYMENT_URL,
            cloudflareVersionId:process.env.CLOUDFLARE_VERSION_ID || null,
            database:'mes-operadores-db',
            authentication:'protected',
            passwordCrypto:'pbkdf2-sha256-webcrypto-10000-peppered',
            workspace:'desktop-tablet-4.1.0',
            adminUserCreate:'transactional-migrated',
            adminPasswordReset:'transactional-migrated',
            turnAssistant:version,
            smoke:'passed'
          };
          const serialized=JSON.stringify(record,null,2)+'\n';
          fs.writeFileSync('deployment/latest.json',serialized);
          fs.writeFileSync(`deployment/history/${process.env.GITHUB_RUN_ID}-success.json`,serialized);
          NODE
          git add deployment/latest.json deployment/latest-failure.json deployment/history 2>/dev/null || git add deployment/latest.json deployment/history
          git diff --cached --quiet || git commit -m "chore: registra deploy do Cloudflare [skip ci]"
          git push origin HEAD:main

      - name: Registrar diagnóstico da falha
        if: failure()
        env:
          PATCH: ${{ steps.patch.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          PREFLIGHT: ${{ steps.preflight.outcome }}
          PEPPER: ${{ steps.pepper.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          DEPLOYMENT_URL: ${{ steps.publish.outputs.url }}
          CLOUDFLARE_VERSION_ID: ${{ steps.publish.outputs.version_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- worker/auth.js worker/bootstrap.js 2>/dev/null || true
          git pull --rebase origin main
          mkdir -p deployment/history
          node - <<'NODE'
          const fs=require('fs');
          const steps={
            patch:process.env.PATCH,
            validate:process.env.VALIDATE,
            preflight:process.env.PREFLIGHT,
            pepper:process.env.PEPPER,
            publish:process.env.PUBLISH,
            smoke:process.env.SMOKE
          };
          const failureStage=Object.entries(steps).find(([,value])=>value==='failure')?.[0] || 'unknown';
          const record={
            status:'failure',
            commit:process.env.GITHUB_SHA,
            workflowRun:process.env.GITHUB_RUN_ID,
            failedAt:new Date().toISOString(),
            failureStage,
            workerPublished:process.env.PUBLISH==='success',
            applicationUrl:process.env.DEPLOYMENT_URL || null,
            cloudflareVersionId:process.env.CLOUDFLARE_VERSION_ID || null,
            steps
          };
          const serialized=JSON.stringify(record,null,2)+'\n';
          fs.writeFileSync('deployment/latest-failure.json',serialized);
          fs.writeFileSync(`deployment/history/${process.env.GITHUB_RUN_ID}-failure.json`,serialized);
          NODE
          git add deployment/latest-failure.json deployment/history
          git diff --cached --quiet || git commit -m "chore: registra falha do deploy [skip ci]"
          git push origin HEAD:main
