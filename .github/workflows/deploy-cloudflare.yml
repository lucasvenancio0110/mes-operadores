name: Deploy NEOMES to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'validation/**'
      - 'deployment/**'
      - 'README.md'
      - '*.md'

permissions:
  contents: write

concurrency:
  group: neomes-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar aplicação e API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar compatibilidade criptográfica do Cloudflare
        run: |
          node scripts/apply-cloudflare-password-crypto.mjs
          grep -q "nodePbkdf2" worker/auth.js
          grep -q "nodePbkdf2" worker/bootstrap.js

      - name: Validar aplicação antes do deploy
        run: |
          node --check worker/main.js
          node --check worker/secure-main.js
          node --check worker/auth.js
          node --check worker/bootstrap.js
          node --check worker/index.js
          node --check app/core.js
          node --check app/operator-main.js
          node --check app/auth-shell.js
          node --check app/bootstrap-admin-ui.js
          node --check app/admin-ui.js
          node --check app/admin-password-fix.js
          node --check app/measurement-engine.js
          node --check app/measurement-frequency-parser.js
          node --check app/measurement-frequency-fix.js
          node --check app/shift-performance.js
          node --check app/shift-time-engine.js
          node --check app/shift-time-fix.js
          node tests/static-check.mjs
          node tests/measurement-plan.test.mjs
          node tests/conference-ux.test.mjs
          node tests/shift-performance.test.mjs
          node tests/shift-time.test.mjs

      - name: Verificar token, conta e banco D1
        id: preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          DATABASE_ID="31666c87-0970-44e1-9969-51458e7888b5"

          if [ -z "$TOKEN" ]; then
            echo "Secret CLOUDFLARE_API_TOKEN não foi encontrado."
            exit 1
          fi
          if [ -z "$ACCOUNT_ID" ]; then
            echo "Secret CLOUDFLARE_ACCOUNT_ID não foi encontrado."
            exit 1
          fi

          VERIFY="$(curl --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          node -e '
            const response = JSON.parse(process.argv[1]);
            if (!response.success || response.result?.status !== "active") {
              console.error("Token do Cloudflare inválido ou inativo:", (response.errors || []).map(item => item.message).join("; "));
              process.exit(1);
            }
            console.log("Token do Cloudflare: ativo.");
          ' "$VERIFY"

          ACCOUNT_RESPONSE="$(curl --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID")"
          node -e '
            const response = JSON.parse(process.argv[1]);
            if (!response.success) {
              console.error("Account ID inválido ou sem acesso:", (response.errors || []).map(item => item.message).join("; "));
              process.exit(1);
            }
            console.log("Conta Cloudflare: acessível.");
          ' "$ACCOUNT_RESPONSE"

          DATABASE_RESPONSE="$(curl --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/d1/database/$DATABASE_ID")"
          node -e '
            const response = JSON.parse(process.argv[1]);
            if (!response.success) {
              console.error("Banco D1 não encontrado ou sem acesso:", (response.errors || []).map(item => item.message).join("; "));
              process.exit(1);
            }
            console.log("Banco D1: acessível.");
          ' "$DATABASE_RESPONSE"

          SUBDOMAIN_RESPONSE="$(curl --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/subdomain")"
          SUBDOMAIN="$(node -e '
            const response = JSON.parse(process.argv[1]);
            if (!response.success) process.exit(0);
            process.stdout.write(response.result?.subdomain || "");
          ' "$SUBDOMAIN_RESPONSE")"

          echo "subdomain=$SUBDOMAIN" >> "$GITHUB_OUTPUT"

      - name: Publicar no Cloudflare Workers
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKERS_SUBDOMAIN: ${{ steps.preflight.outputs.subdomain }}
        run: |
          set -euo pipefail

          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"

          npx --yes wrangler@4.68.0 deploy 2>&1 | tee wrangler-deploy.log

          DEPLOYMENT_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' wrangler-deploy.log | tail -n 1 || true)"
          if [ -z "$DEPLOYMENT_URL" ] && [ -n "$WORKERS_SUBDOMAIN" ]; then
            DEPLOYMENT_URL="https://mes-operadores.$WORKERS_SUBDOMAIN.workers.dev"
          fi

          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "O deploy terminou, mas não foi possível identificar o endereço workers.dev."
            exit 1
          fi

          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Aplicação publicada em $DEPLOYMENT_URL"

      - name: Verificar Worker, banco e autenticação protegida
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail

          HEALTH="$(curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "$DEPLOYMENT_URL/health")"
          echo "$HEALTH"

          node -e '
            const health = JSON.parse(process.argv[1]);
            if (!health.ok) throw new Error("Worker não respondeu como saudável.");
            if (!health.database) throw new Error("O binding DB não está conectado ao D1.");
          ' "$HEALTH"

          INDEX="$(curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 3 "$DEPLOYMENT_URL/")"
          printf '%s' "$INDEX" | grep -q 'NEOMES — Gestão Operacional'

          AUTH_FILE="$(mktemp)"
          AUTH_STATUS="$(curl --silent --show-error --output "$AUTH_FILE" --write-out '%{http_code}' "$DEPLOYMENT_URL/api/v1/auth/me")"
          if [ "$AUTH_STATUS" != "401" ]; then
            echo "A rota protegida deveria responder 401 sem sessão, mas respondeu $AUTH_STATUS."
            cat "$AUTH_FILE"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const response = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (response.code !== "UNAUTHENTICATED") throw new Error("A autenticação protegida não respondeu corretamente.");
          ' "$AUTH_FILE"

          {
            echo "### NEOMES publicado com sucesso"
            echo ""
            echo "- Aplicação: $DEPLOYMENT_URL"
            echo "- Saúde do banco: $DEPLOYMENT_URL/health"
            echo "- Autenticação: protegida e respondendo corretamente"
            echo "- Senhas: PBKDF2 SHA-256 via node:crypto"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Registrar resultado do deploy
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          mkdir -p deployment
          node - <<'NODE'
          const fs = require('fs');
          const result = {
            status: 'success',
            commit: process.env.GITHUB_SHA,
            workflowRun: process.env.GITHUB_RUN_ID,
            deployedAt: new Date().toISOString(),
            applicationUrl: process.env.DEPLOYMENT_URL,
            database: 'mes-operadores-db',
            authentication: 'protected',
            passwordCrypto: 'pbkdf2-sha256-node-crypto'
          };
          fs.writeFileSync('deployment/latest.json', JSON.stringify(result, null, 2) + '\n');
          NODE
          git add deployment/latest.json
          git commit -m "chore: registra deploy do Cloudflare [skip ci]"
          git push origin HEAD:main
