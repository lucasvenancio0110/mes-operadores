name: Deploy NEOMES to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'validation/**'
      - 'deployment/**'
      - 'README.md'
      - '*.md'

permissions:
  contents: write

concurrency:
  group: neomes-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar aplicação e API
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar criptografia de senha
        id: patch
        run: |
          set -euo pipefail
          node scripts/apply-cloudflare-password-crypto.mjs
          grep -q "const PASSWORD_ITERATIONS = 10000;" worker/auth.js
          grep -q "const ITERATIONS = 10000;" worker/bootstrap.js
          grep -q "NEOMES_PASSWORD_PEPPER" worker/auth.js
          grep -q "NEOMES_PASSWORD_PEPPER" worker/bootstrap.js
          node --check worker/auth.js
          node --check worker/bootstrap.js
          node --check worker/admin-user-create.js
          node --check worker/admin-password-reset.js
          node --check worker/turn-assistant.js
          node --check worker/secure-main.js

      - name: Validar aplicação
        id: validate
        run: |
          set -euo pipefail
          node --check worker/main.js
          node --check worker/index.js
          node --check app/core.js
          node --check app/operator-main.js
          node --check app/auth-shell.js
          node --check app/bootstrap-admin-ui.js
          node --check app/admin-ui.js
          node --check app/admin-password-fix.js
          node --check app/admin-password-reset-fix.js
          node --check app/admin-user-create.js
          node --check app/desktop-workspace.js
          node --check app/turn-assistant-engine.js
          node --check app/turn-assistant.js
          node --check app/turn-assistant-autostart.js
          node --check sw.js
          test -f app/desktop-workspace.css
          test -f app/desktop-workspace-fix.css
          test -f app/turn-assistant.css
          node --check app/measurement-engine.js
          node --check app/measurement-frequency-parser.js
          node --check app/measurement-frequency-fix.js
          node --check app/shift-performance.js
          node --check app/shift-time-engine.js
          node --check app/shift-time-fix.js
          node tests/static-check.mjs
          node tests/measurement-plan.test.mjs
          node tests/conference-ux.test.mjs
          node tests/shift-performance.test.mjs
          node tests/shift-time.test.mjs
          node tests/turn-assistant.test.mjs

      - name: Verificar Cloudflare e D1
        id: preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          DATABASE_ID="31666c87-0970-44e1-9969-51458e7888b5"

          test -n "$TOKEN" || { echo "CLOUDFLARE_API_TOKEN ausente."; exit 1; }
          test -n "$ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID ausente."; exit 1; }

          VERIFY="$(curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.success || x.result?.status!=="active") process.exit(1)' "$VERIFY"

          DATABASE="$(curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/d1/database/$DATABASE_ID")"
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.success) process.exit(1)' "$DATABASE"

          SUBDOMAIN_RESPONSE="$(curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/subdomain")"
          SUBDOMAIN="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.result?.subdomain || "")' "$SUBDOMAIN_RESPONSE")"
          echo "subdomain=$SUBDOMAIN" >> "$GITHUB_OUTPUT"

      - name: Garantir pepper secreto
        id: pepper
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"

          SECRET_LIST="$(npx --yes wrangler@4.68.0 secret list --format json)"
          HAS_PEPPER="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.some(i=>i.name==="NEOMES_PASSWORD_PEPPER")?"yes":"no")' "$SECRET_LIST")"

          if [ "$HAS_PEPPER" = "no" ]; then
            PEPPER="$(openssl rand -hex 32)"
            printf '%s\n' "$PEPPER" | npx --yes wrangler@4.68.0 secret put NEOMES_PASSWORD_PEPPER >/dev/null
            unset PEPPER
            echo "Pepper criado e armazenado como Secret no Cloudflare."
          else
            echo "Pepper existente preservado."
          fi

      - name: Publicar no Cloudflare Workers
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKERS_SUBDOMAIN: ${{ steps.preflight.outputs.subdomain }}
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"

          npx --yes wrangler@4.68.0 deploy 2>&1 | tee wrangler-deploy.log
          URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' wrangler-deploy.log | tail -n 1 || true)"
          if [ -z "$URL" ] && [ -n "$WORKERS_SUBDOMAIN" ]; then
            URL="https://mes-operadores.$WORKERS_SUBDOMAIN.workers.dev"
          fi
          test -n "$URL" || { echo "Endereço do Worker não encontrado."; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Testar Worker publicado
        id: smoke
        env:
          DEPLOYMENT_URL: ${{ steps.publish.outputs.url }}
        run: |
          set -euo pipefail

          HEALTH="$(curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 4 "$DEPLOYMENT_URL/health")"
          node -e 'const health=JSON.parse(process.argv[1]); if(!health.ok || !health.database) process.exit(1)' "$HEALTH"

          echo "Aguardando a propagação completa do Worker e dos secrets..."
          sleep 12

          wait_json() {
            local path="$1"
            local label="$2"
            local file
            file="$(mktemp)"
            local status=""
            for attempt in $(seq 1 20); do
              status="$(curl --silent --show-error --output "$file" --write-out '%{http_code}' "$DEPLOYMENT_URL$path" || true)"
              if [ "$status" = "200" ]; then
                cat "$file"
                return 0
              fi
              echo "$label ainda propagando: tentativa $attempt/20, HTTP ${status:-indisponível}." >&2
              sleep 5
            done
            echo "Falha em $label:" >&2
            cat "$file" >&2
            return 1
          }

          CRYPTO="$(wait_json '/api/v1/auth/crypto-health' 'PBKDF2')"
          node -e '
            const x=JSON.parse(process.argv[1]);
            if(!x.ok) throw new Error(x.error || "PBKDF2 falhou");
            if(x.algorithm!=="PBKDF2-SHA256-WebCrypto-Peppered") throw new Error("Algoritmo incorreto");
            if(Number(x.iterations)!==10000) throw new Error("Iterações incorretas");
            if(!x.pepperConfigured) throw new Error("Pepper ausente");
          ' "$CRYPTO"

          ADMIN_CREATE="$(wait_json '/api/v1/auth/admin-user-create-health' 'Cadastro administrativo')"
          node -e '
            const x=JSON.parse(process.argv[1]);
            if(!x.ok || !x.schemaReady || x.missingColumns?.length) throw new Error("Migração administrativa incompleta");
            if(!x.passwordHashReady || x.transaction!=="d1-batch") throw new Error("Cadastro administrativo inseguro");
          ' "$ADMIN_CREATE"

          ADMIN_RESET="$(wait_json '/api/v1/auth/admin-password-reset-health' 'Redefinição de senha')"
          node -e '
            const x=JSON.parse(process.argv[1]);
            if(!x.ok || !x.schemaReady || !x.passwordHashReady || !x.temporaryPasswordPolicy) throw new Error("Redefinição de senha indisponível");
            if(x.transaction!=="d1-batch") throw new Error("Reset não transacional");
          ' "$ADMIN_RESET"

          TURN_ASSISTANT="$(wait_json '/api/v1/auth/turn-assistant-health' 'Assistente de turno')"
          node -e '
            const x=JSON.parse(process.argv[1]);
            if(!x.ok || !x.schemaReady || !x.periodCalculationReady) throw new Error("Assistente de turno indisponível");
            if(Number(x.shiftMinutes)!==480) throw new Error("Relógio do turno incorreto");
            if(x.transaction!=="d1-batch") throw new Error("Persistência do turno não transacional");
            if(!Array.isArray(x.tables) || x.tables.length!==4) throw new Error("Tabelas do turno incompletas");
          ' "$TURN_ASSISTANT"

          INDEX="$(curl --fail --silent --show-error "$DEPLOYMENT_URL/")"
          printf '%s' "$INDEX" | grep -q 'NEOMES — Gestão Operacional'
          printf '%s' "$INDEX" | grep -q 'desktop-workspace.css?v=4.1.0'
          printf '%s' "$INDEX" | grep -q 'turn-assistant.css?v=5.0.0'
          printf '%s' "$INDEX" | grep -q 'turn-assistant.js?v=5.0.0'
          printf '%s' "$INDEX" | grep -q 'turn-assistant-autostart.js?v=5.0.0'

          TURN_CSS="$(curl --fail --silent --show-error "$DEPLOYMENT_URL/app/turn-assistant.css?v=5.0.0")"
          printf '%s' "$TURN_CSS" | grep -q 'ta-material-block'
          printf '%s' "$TURN_CSS" | grep -q 'ta-forecast-time'

          TURN_JS="$(curl --fail --silent --show-error "$DEPLOYMENT_URL/app/turn-assistant.js?v=5.0.0")"
          printf '%s' "$TURN_JS" | grep -q 'Confirmar e iniciar turno'
          printf '%s' "$TURN_JS" | grep -q 'Peças boas produzidas'

          ENGINE="$(curl --fail --silent --show-error "$DEPLOYMENT_URL/app/turn-assistant-engine.js?v=5.0.0")"
          printf '%s' "$ENGINE" | grep -q 'A matéria-prima informada deverá acabar antes de atingir a meta da OP.'
          printf '%s' "$ENGINE" | grep -q 'DEFAULT_SHIFT_MINUTES = 480'

          AUTH_FILE="$(mktemp)"
          AUTH_STATUS="$(curl --silent --show-error --output "$AUTH_FILE" --write-out '%{http_code}' "$DEPLOYMENT_URL/api/v1/auth/me")"
          test "$AUTH_STATUS" = "401"
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(x.code!=="UNAUTHENTICATED") process.exit(1)' "$AUTH_FILE"

          CONTEXT_FILE="$(mktemp)"
          CONTEXT_STATUS="$(curl --silent --show-error --output "$CONTEXT_FILE" --write-out '%{http_code}' "$DEPLOYMENT_URL/api/v1/turn-assistant/context?machineId=tnl-091&lineId=linha-05&productionDate=2026-08-05&shift=2")"
          test "$CONTEXT_STATUS" = "401"
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(x.code!=="UNAUTHENTICATED") process.exit(1)' "$CONTEXT_FILE"

      - name: Registrar deploy concluído
        if: success()
        env:
          DEPLOYMENT_URL: ${{ steps.publish.outputs.url }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- worker/auth.js worker/bootstrap.js
          git pull --rebase origin main
          mkdir -p deployment
          rm -f deployment/latest-failure.json
          node - <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('deployment/latest.json', JSON.stringify({
            status:'success',
            commit:process.env.GITHUB_SHA,
            workflowRun:process.env.GITHUB_RUN_ID,
            deployedAt:new Date().toISOString(),
            applicationUrl:process.env.DEPLOYMENT_URL,
            database:'mes-operadores-db',
            authentication:'protected',
            passwordCrypto:'pbkdf2-sha256-webcrypto-10000-peppered',
            workspace:'desktop-tablet-4.1.0',
            adminUserCreate:'transactional-migrated',
            adminPasswordReset:'transactional-migrated',
            turnAssistant:'5.0.0-confirm-by-exception'
          },null,2)+'\n');
          NODE
          git add deployment/latest.json deployment/latest-failure.json 2>/dev/null || git add deployment/latest.json
          git diff --cached --quiet || git commit -m "chore: registra deploy do Cloudflare [skip ci]"
          git push origin HEAD:main

      - name: Registrar diagnóstico da falha
        if: failure()
        env:
          PATCH: ${{ steps.patch.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          PREFLIGHT: ${{ steps.preflight.outcome }}
          PEPPER: ${{ steps.pepper.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- worker/auth.js worker/bootstrap.js 2>/dev/null || true
          git pull --rebase origin main
          mkdir -p deployment
          node - <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('deployment/latest-failure.json', JSON.stringify({
            status:'failure',
            commit:process.env.GITHUB_SHA,
            workflowRun:process.env.GITHUB_RUN_ID,
            failedAt:new Date().toISOString(),
            steps:{
              patch:process.env.PATCH,
              validate:process.env.VALIDATE,
              preflight:process.env.PREFLIGHT,
              pepper:process.env.PEPPER,
              publish:process.env.PUBLISH,
              smoke:process.env.SMOKE
            }
          },null,2)+'\n');
          NODE
          git add deployment/latest-failure.json
          git diff --cached --quiet || git commit -m "chore: registra falha do deploy [skip ci]"
          git push origin HEAD:main
