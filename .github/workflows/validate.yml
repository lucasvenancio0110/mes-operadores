name: Validate MES

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - validation/latest.json
      - validation/log.txt
      - 'deployment/**'
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run validation suite
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p validation
          set +e
          {
            echo "Commit: $GITHUB_SHA"
            echo "Started: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            node --check app/catalog.js
            node --check app/core.js
            node --check app/components.js
            node --check app/brand.js
            node --check app/operator-main.js
            node --check app/auth-shell.js
            node --check app/desktop-workspace.js
            node --check app/cloud-state.js
            node --check app/exports.js
            node --check app/premium-runtime.js
            node --check app/production-planning.js
            node --check app/measurement-engine.js
            node --check app/measurement-frequency-parser.js
            node --check app/measurement-plan.js
            node --check app/measurement-frequency-fix.js
            node --check app/conference-ux.js
            node --check app/shift-performance.js
            node --check app/shift-time-engine.js
            node --check app/shift-time-fix.js
            node --check app/turn-assistant-engine.js
            node --check app/turn-assistant-submit.js
            node --check app/turn-assistant.js
            node --check sw.js
            node scripts/apply-cloudflare-password-crypto.mjs
            node --check worker/auth.js
            node --check worker/bootstrap.js
            node --check worker/admin-user-create.js
            node --check worker/admin-password-reset.js
            node --check worker/secure-main.js
            node --check worker/main.js
            node --check worker/index.js
            node --check worker/database.js
            node --check worker/learning.js
            node --check worker/shift.js
            node --check worker/operations.js
            node --check worker/settings.js
            node --check worker/turn-assistant.js
            node --check tests/static-check.mjs
            node --check tests/password-migration.test.mjs
            node --check tests/measurement-plan.test.mjs
            node --check tests/conference-ux.test.mjs
            node --check tests/shift-performance.test.mjs
            node --check tests/shift-time.test.mjs
            node --check tests/turn-assistant.test.mjs
            node --check tests/turn-flow-v6.test.mjs
            node tests/static-check.mjs
            node tests/password-migration.test.mjs
            node tests/measurement-plan.test.mjs
            node tests/conference-ux.test.mjs
            node tests/shift-performance.test.mjs
            node tests/shift-time.test.mjs
            node tests/turn-assistant.test.mjs
            node tests/turn-flow-v6.test.mjs
            node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('Manifest JSON passed.')"
            test -f offline.html
            test -f assets/brand/neomes-logo-horizontal.svg
            test -f assets/brand/neomes-symbol.svg
            test -f icons/neomes-app-icon.svg
            test -f icons/neomes-app-icon-maskable.svg
            test -f app/app.css
            test -f app/operator.css
            test -f app/premium.css
            test -f app/premium-runtime.css
            test -f app/brand.css
            test -f app/cloud-sync.css
            test -f app/planning.css
            test -f app/measurement-plan.css
            test -f app/conference-ux.css
            test -f app/desktop-nav.css
            test -f app/shift-performance.css
            test -f app/brand.js
            test -f app/operator-main.js
            test -f app/premium-runtime.js
            test -f app/production-planning.js
            test -f app/measurement-engine.js
            test -f app/measurement-frequency-parser.js
            test -f app/measurement-plan.js
            test -f app/measurement-frequency-fix.js
            test -f app/conference-ux.js
            test -f app/shift-performance.js
            test -f app/shift-time-engine.js
            test -f app/shift-time-fix.js
            test -f app/turn-assistant.css
            test -f app/turn-assistant-submit.js
            test -f app/turn-assistant.js
            test -f tests/password-migration.test.mjs
            test -f tests/shift-time.test.mjs
            test -f tests/turn-assistant.test.mjs
            test -f worker/settings.js
            test -f wrangler.jsonc
            test -f .assetsignore
            test -f .github/workflows/deploy-cloudflare.yml
          } > validation/log.txt 2>&1
          STATUS=$?
          STATUS=$STATUS node - <<'NODE'
          const fs = require('fs');
          const status = process.env.STATUS === '0' ? 'success' : 'failure';
          const result = {
            status,
            commit: process.env.GITHUB_SHA,
            workflowRun: process.env.GITHUB_RUN_ID,
            validatedAt: new Date().toISOString(),
            checks: [
              'javascript-syntax',
              'legacy-password-automatic-migration',
              'worker-syntax',
              'static-architecture',
              'manifest-json',
              'pwa-required-files',
              'official-neomes-branding',
              'brand-responsive-header',
              'brand-menu-login-splash',
              'brand-pwa-icons',
              'cloudflare-worker-assets',
              'cloudflare-d1-binding',
              'cloudflare-deploy-workflow',
              'sync-warning-only-on-errors',
              'operator-simplification',
              'premium-design-system',
              'production-planning',
              'measurement-op-total',
              'measurement-shift-triggers',
              'measurement-secondary-frequency',
              'measurement-rounded-frequency',
              'measurement-balanced-after-shift',
              'measurement-frequency-pair-parser',
              'material-calculation',
              'global-settings',
              'compact-conference',
              'order-continuity',
              'production-reconciliation',
              'material-stepper',
              'shift-performance',
              'stoppage-time',
              'target-color-status',
              'full-shift-480-minutes',
              'cycle-decimal-minute-conversion',
              'turn-v6-automatic-shift',
              'turn-v6-logical-clock',
              'turn-v6-independent-states'
            ]
          };
          fs.writeFileSync('validation/latest.json', JSON.stringify(result, null, 2) + '\n');
          NODE
          cat validation/log.txt
          exit $STATUS

      - name: Publish validation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neomes-validation-${{ github.run_id }}
          path: |
            validation/latest.json
            validation/log.txt
          if-no-files-found: error
          retention-days: 30

      - name: Fail workflow when validation fails
        if: steps.validation.outcome == 'failure'
        run: exit 1
