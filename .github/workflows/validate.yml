name: Validate MES

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app/catalog.js
          node --check app/core.js
          node --check app/components.js
          node --check app/main.js
          node --check app/runtime.js
          node --check sw.js
          node --check worker/main.js
          node --check worker/index.js
          node --check worker/database.js
          node --check worker/learning.js
          node --check worker/shift.js
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"
      - name: Check required PWA files
        run: test -f offline.html && test -f icons/mes-icon.svg && test -f app/app.css
