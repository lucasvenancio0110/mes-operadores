name: Apply DOM Stability Fix

on:
  push:
    branches:
      - agent/neomes-architecture-recovery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/neomes-architecture-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar correção de estabilidade
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p=Path(path)
              text=p.read_text()
              if old not in text:
                  raise SystemExit(f'Bloco esperado não encontrado em {path}: {old[:100]!r}')
              p.write_text(text.replace(old,new,1))

          replace_exact('app/operator-main.js',
          "const NON_RENDERING_STORE_REASONS = new Set(['conference-draft','sync','sync-error','queue','queue-flush']);\nstore.subscribe((_state, reason) => {\n  if (!NON_RENDERING_STORE_REASONS.has(reason)) render();\n});",
          "const NON_RENDERING_STORE_REASONS = new Set([\n  'conference-draft','sync','sync-error','queue','queue-flush','ui-normalize',\n  'cloud-events','cloud-machine-states','machine-runtime-status'\n]);\nfunction storeReasonOwnsRendering(reason) {\n  const value=String(reason || '');\n  return NON_RENDERING_STORE_REASONS.has(value) || value.startsWith('ta-') || value.startsWith('turn-assistant-');\n}\nstore.subscribe((_state, reason) => {\n  if (!storeReasonOwnsRendering(reason)) render();\n});")

          replace_exact('app/turn-assistant.js',
          """    if(!session){
      const empty=card.querySelector('.ops-empty-machine p');
      if(empty)empty.textContent='Busque a OP ativa, confirme a produção e informe o material disponível.';
      const button=card.querySelector('[data-action=\"open-conference\"]');if(button)button.textContent='Assumir máquina';
      return;
    }""",
          """    if(!session){
      const signature=`empty|${assignment.machineId}|${shiftKey()}`;
      if(card.dataset.taSignature===signature)return;
      const empty=card.querySelector('.ops-empty-machine p');
      const emptyText='Busque a OP ativa, confirme a produção e informe o material disponível.';
      if(empty&&empty.textContent!==emptyText)empty.textContent=emptyText;
      const button=card.querySelector('[data-action=\"open-conference\"]');
      if(button&&button.textContent!=='Assumir máquina')button.textContent='Assumir máquina';
      card.dataset.taSignature=signature;
      return;
    }""")

          replace_exact('app/turn-assistant.js',
          """    if((!session.turnAssistantConfirmedAt||session.turnAssistantShiftKey!==shiftKey())&&!session.assistantMachineStopped){
      const machine=machineInfo(assignment.machineId);
      card.dataset.turnAssistant='true';
      card.innerHTML=`<header class=\"ta-card-head\"><div><h2>${escapeHtml(machine.name)}</h2><p>${escapeHtml(machine.lineName)}</p></div><span class=\"ta-status-pill\" data-status=\"pointed\">CONFERÊNCIA PENDENTE</span></header><section class=\"ta-conference-callout\"><strong>Confirme esta máquina antes de usar</strong><p>O NEOMES vai buscar a OP ativa e eliminar automaticamente qualquer informação antiga deste aparelho.</p></section><footer class=\"ta-card-actions ta-card-actions--single\"><button class=\"ops-btn ops-btn--primary\" type=\"button\" data-ta-reconfirm=\"${escapeHtml(assignment.machineId)}\">Fazer conferência</button></footer>`;
      reconcileLocalSession(assignment.machineId);
      return;
    }""",
          """    if((!session.turnAssistantConfirmedAt||session.turnAssistantShiftKey!==shiftKey())&&!session.assistantMachineStopped){
      const machine=machineInfo(assignment.machineId);
      const signature=['conference-pending',assignment.machineId,session.op||'',session.status||'',session.turnAssistantShiftKey||'',shiftKey()].join('|');
      if(card.dataset.taSignature===signature&&card.querySelector('[data-ta-reconfirm]'))return;
      card.dataset.taSignature=signature;
      card.dataset.turnAssistant='true';
      card.innerHTML=`<header class=\"ta-card-head\"><div><h2>${escapeHtml(machine.name)}</h2><p>${escapeHtml(machine.lineName)}</p></div><span class=\"ta-status-pill\" data-status=\"pointed\">CONFERÊNCIA PENDENTE</span></header><section class=\"ta-conference-callout\"><strong>Confirme esta máquina antes de usar</strong><p>O NEOMES vai buscar a OP ativa e eliminar automaticamente qualquer informação antiga deste aparelho.</p></section><footer class=\"ta-card-actions ta-card-actions--single\"><button class=\"ops-btn ops-btn--primary\" type=\"button\" data-ta-reconfirm=\"${escapeHtml(assignment.machineId)}\">Fazer conferência</button></footer>`;
      reconcileLocalSession(assignment.machineId);
      return;
    }""")

          replace_exact('app/turn-assistant.js',
          """function schedule() {
  cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>{
    enhanceCards();
    const oldConference=document.getElementById('conferenceLayer');
    if(oldConference&&!oldConference.dataset.turnAssistant&&!observerBusy&&authReady()){
      observerBusy=true;const machineId=store.state.activeMachineId;queueMicrotask(async()=>{try{await openHandoff(machineId);}finally{observerBusy=false;}});
    }
  });
}
new MutationObserver(schedule).observe(document.body,{ childList:true,subtree:true });
store.subscribe(schedule);
schedule();""",
          """function schedule() {
  cancelAnimationFrame(frame);
  frame=requestAnimationFrame(enhanceCards);
}
function scheduleLegacyConference() {
  const oldConference=document.getElementById('conferenceLayer');
  if(oldConference&&!oldConference.dataset.turnAssistant&&!observerBusy&&authReady()){
    observerBusy=true;
    const machineId=store.state.activeMachineId;
    queueMicrotask(async()=>{try{await openHandoff(machineId);}finally{observerBusy=false;}});
  }
}
const appRoot=document.getElementById('app');
if(appRoot)new MutationObserver(schedule).observe(appRoot,{ childList:true,subtree:true });
if(layers)new MutationObserver(scheduleLegacyConference).observe(layers,{ childList:true,subtree:true });
store.subscribe((_state,reason)=>{ if(reason!=='ta-active-machine')schedule(); });
schedule();
scheduleLegacyConference();""")

          replace_exact('app/turn-assistant-autostart.js',
          "new MutationObserver(attempt).observe(document.body,{ childList:true,subtree:true });",
          "new MutationObserver(attempt).observe(document.getElementById('app') || document.body,{ childList:true,subtree:true });")

          replace_exact('app/machine-runtime.js',
          "new MutationObserver(schedule).observe(document.body,{ childList:true,subtree:true });",
          "new MutationObserver(schedule).observe(document.getElementById('app') || document.body,{ childList:true,subtree:true });")

          replace_exact('tests/e2e/authenticated-boot-resilience.spec.mjs',
          "await page.locator('[data-action=\"menu\"]').tap();",
          "await page.getByRole('button',{ name:'Abrir menu' }).first().tap();")

          replace_exact('index.html',
          '<script type="module" src="app/turn-assistant.js?v=6.0.1"></script>',
          '<script type="module" src="app/turn-assistant.js?v=6.0.2"></script>')
          replace_exact('index.html',
          '<script type="module" src="app/machine-runtime.js?v=1.0.0"></script>',
          '<script type="module" src="app/machine-runtime.js?v=1.0.1"></script>')
          replace_exact('index.html',
          '<script type="module" src="app/turn-assistant-autostart.js?v=6.0.0"></script>',
          '<script type="module" src="app/turn-assistant-autostart.js?v=6.0.1"></script>')

          replace_exact('app/turn-assistant.js',"const VERSION = '6.0.1';","const VERSION = '6.0.2';")
          PY

          cat > tests/e2e/dom-stability-regression.spec.mjs <<'EOF'
          import { test,expect } from '@playwright/test';
          import { installForensicApi } from './support/forensic-api.mjs';

          async function waitForOperationalBoot(page){
            await expect(page.getByText('TNL 091',{ exact:true }).first()).toBeVisible();
            await page.waitForFunction(()=>Boolean(window.__NEOMES_MODULE_BOOT));
            await page.waitForTimeout(350);
          }

          test('painel estabiliza sem ciclo de MutationObserver e o primeiro toque abre a conferência',async({ page })=>{
            const errors=[];
            page.on('pageerror',error=>errors.push(error.message));
            await installForensicApi(page);
            await page.goto('/');
            await waitForOperationalBoot(page);

            const mutations=await page.evaluate(async()=>{
              const app=document.getElementById('app');
              let count=0;
              const observer=new MutationObserver(records=>{ count+=records.length; });
              observer.observe(app,{ childList:true,subtree:true,characterData:true });
              await new Promise(resolve=>setTimeout(resolve,650));
              observer.disconnect();
              return count;
            });
            expect(mutations).toBe(0);

            const conference=page.getByRole('button',{ name:/^(Assumir máquina|Fazer conferência)$/ }).first();
            await expect(conference).toBeVisible();
            await conference.evaluate(element=>{ window.__NEOMES_TOUCH_TARGET=element; });
            await conference.tap();
            await expect(page.locator('#taHandoffForm')).toBeVisible();
            expect(await page.evaluate(()=>window.__NEOMES_TOUCH_TARGET?.isConnected)).toBe(true);
            expect(errors).toEqual([]);
          });

          test('campo de peças boas não é recriado nem perde valor durante o fechamento da OP',async({ page })=>{
            const errors=[];
            page.on('pageerror',error=>errors.push(error.message));
            await installForensicApi(page);
            await page.goto('/');
            await waitForOperationalBoot(page);

            const conference=page.getByRole('button',{ name:/^(Assumir máquina|Fazer conferência)$/ }).first();
            await conference.tap();
            const handoff=page.locator('#taHandoffForm');
            await expect(handoff).toBeVisible();
            await handoff.locator('[name="currentBarPieces"]').fill('20');
            await handoff.locator('[name="feederBars"]').fill('2');
            await page.locator('[data-ta-submit-form="taHandoffForm"]').click();
            await expect(page.getByText(/pronta para o turno/).first()).toBeVisible();
            await page.getByRole('button',{ name:'Voltar ao painel' }).click();

            await page.getByRole('button',{ name:'Encerrar OP' }).click();
            const form=page.locator('#taOrderCloseForm');
            await expect(form).toBeVisible();
            const good=form.locator('[data-ta-good]');
            await good.fill('20');
            await expect(good).toHaveValue('20');
            const original=await good.evaluate(element=>{ window.__NEOMES_GOOD_FIELD=element; return element.name; });
            expect(original).toBeTruthy();
            await page.waitForTimeout(900);
            await expect(good).toHaveValue('20');
            expect(await page.evaluate(()=>window.__NEOMES_GOOD_FIELD?.isConnected)).toBe(true);

            await form.locator('[data-ta-rejects]').fill('0');
            await form.locator('[data-ta-stops]').fill('0');
            await page.locator('[data-ta-submit-form="taOrderCloseForm"]').click();
            await expect(page.getByText('Nova OP do mesmo item')).toBeVisible();
            await expect(page.getByText('Máquina ficará parada')).toBeVisible();
            expect(errors).toEqual([]);
          });
          EOF

          node --check app/operator-main.js
          node --check app/turn-assistant.js
          node --check app/turn-assistant-autostart.js
          node --check app/machine-runtime.js
          node --check tests/e2e/dom-stability-regression.spec.mjs

      - name: Commitar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/operator-main.js app/turn-assistant.js app/turn-assistant-autostart.js app/machine-runtime.js index.html tests/e2e/authenticated-boot-resilience.spec.mjs tests/e2e/dom-stability-regression.spec.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix: estabiliza DOM e elimina rerenders durante o toque"
          git push origin HEAD:agent/neomes-architecture-recovery
