name: Apply NEOMES interaction stability fix

on:
  push:
    branches:
      - agent/neomes-architecture-recovery
    paths:
      - scripts/apply-interaction-stability-fix.mjs
      - .github/workflows/apply-neomes-interaction-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: agent/neomes-architecture-recovery

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply deterministic patch
        run: node scripts/apply-interaction-stability-fix.mjs

      - name: Validate patched modules
        run: |
          node --check app/operator-main.js
          node --check app/turn-assistant.js
          node --check app/turn-assistant-submit.js

      - name: Commit patched runtime
        run: |
          if git diff --quiet -- app/operator-main.js app/turn-assistant.js app/turn-assistant-submit.js; then
            echo "No runtime changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/operator-main.js app/turn-assistant.js app/turn-assistant-submit.js
          git commit -m "fix: stabilize NEOMES interaction ownership"
          git push origin HEAD:agent/neomes-architecture-recovery
