name: Build Pixi Bundle TEMP

on:
  push:
    branches: ['agent/factory-map-pixi-beta']
    paths:
      - 'app/factory-map-pixi-source.js'
      - 'package.json'
      - '.github/workflows/build-pixi-bundle-temp.yml'

permissions:
  contents: write

concurrency:
  group: build-pixi-beta
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/factory-map-pixi-beta
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências fixadas
        run: npm install --no-audit --no-fund

      - name: Gerar e validar bundle Pixi
        run: |
          set -euo pipefail
          mkdir -p app/vendor
          node --check app/factory-map-pixi-source.js
          npm run build:factory-map-pixi
          node --check app/vendor/factory-map-pixi.bundle.js
          test -s app/vendor/factory-map-pixi.bundle.js
          grep -q "PixiJS" app/vendor/factory-map-pixi.bundle.js

      - name: Commitar lockfile e bundle gerado
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json app/vendor/factory-map-pixi.bundle.js
          if git diff --cached --quiet; then
            echo "Bundle e lockfile já estão atualizados."
            exit 0
          fi
          git commit -m "build: fixa bundle local PixiJS [skip ci]"
          git push origin HEAD:agent/factory-map-pixi-beta
