name: NEOMES Recovery Gate

on:
  push:
    branches:
      - agent/neomes-architecture-recovery
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  behavior-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run calculation and architecture regression
        run: npm run test:regression

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: Run mobile WebKit behavior tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: neomes-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
