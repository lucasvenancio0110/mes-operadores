name: NEOMES Recovery Gate

on:
  push:
    branches:
      - agent/neomes-architecture-recovery
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  behavior-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check recovery module syntax
        run: |
          node --check app/machine-runtime.js
          node --check worker/machine-runtime.js

      - name: Run full interaction static forensics
        run: node tests/interaction-static-forensics.test.mjs

      - name: Run calculation and architecture regression
        run: npm run test:regression

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: Prepare exact current main worktree
        run: |
          git fetch origin main
          rm -rf /tmp/neomes-main
          git worktree add --detach /tmp/neomes-main origin/main

      - name: Forensic WebKit comparison against current main
        env:
          NEOMES_E2E_ROOT: /tmp/neomes-main
          NEOMES_FORENSIC_MAIN: '1'
        run: npx playwright test tests/e2e/main-forensics.spec.mjs --retries=0

      - name: Run mobile WebKit behavior tests
        run: npm run test:e2e

      - name: Stress click integrity and ownership
        run: npx playwright test tests/e2e/click-integrity.spec.mjs tests/e2e/interaction-ownership.spec.mjs --repeat-each=3 --retries=0

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: neomes-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore