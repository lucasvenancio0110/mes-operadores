name: NEOMES Recovery Gate

on:
  push:
    branches:
      - agent/neomes-architecture-recovery
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: neomes-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behavior-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply single-hydration candidate in test workspace
        run: |
          python - <<'PY'
          from pathlib import Path

          operator=Path('app/operator-main.js')
          text=operator.read_text()
          old_sub="""const NON_RENDERING_STORE_REASONS = new Set([
            'conference-draft','sync','sync-error','queue','queue-flush','ui-normalize',
            'cloud-events','cloud-machine-states','machine-runtime-status'
          ]);
          function storeReasonOwnsRendering(reason) {
            const value=String(reason || '');
            return NON_RENDERING_STORE_REASONS.has(value) || value.startsWith('ta-') || value.startsWith('turn-assistant-');
          }
          store.subscribe((_state, reason) => {
            if (!storeReasonOwnsRendering(reason)) render();
          });"""
          new_sub="""const NON_RENDERING_STORE_REASONS = new Set([
            'conference-draft','sync','sync-error','queue','queue-flush','ui-normalize',
            'cloud-events','cloud-machine-states','machine-runtime-status'
          ]);
          let bootHydrating = true;
          function storeReasonOwnsRendering(reason) {
            const value=String(reason || '');
            return bootHydrating || NON_RENDERING_STORE_REASONS.has(value) || value.startsWith('ta-') || value.startsWith('turn-assistant-');
          }
          store.subscribe((_state, reason) => {
            if (!storeReasonOwnsRendering(reason)) render();
          });"""
          old_start="""async function start() {
            store.update(state => {
              state.ui ||= {};
              if (!ROUTES.has(state.ui.route)) state.ui.route = 'turn';
              state.ui.historyPeriod ||= 'today';
            }, 'ui-normalize');
            render();
            if (API_BASE) {
              await Promise.allSettled([loadCloudCatalog(), loadCloudRecords()]);
            }
            if (!store.state.session) return loginSheet();
            await loadAssignments();
            render();
            if (!store.state.assignments.length) openAssignments();
          }

          start();"""
          new_start="""async function start() {
            try {
              store.update(state => {
                state.ui ||= {};
                if (!ROUTES.has(state.ui.route)) state.ui.route = 'turn';
                state.ui.historyPeriod ||= 'today';
              }, 'ui-normalize');
              if (API_BASE) await Promise.allSettled([loadCloudCatalog(), loadCloudRecords()]);
              if (store.state.session) await loadAssignments();
            } finally {
              bootHydrating = false;
              render();
            }
            if (!store.state.session) return loginSheet();
            if (!store.state.assignments.length) openAssignments();
          }

          start();"""
          if old_sub in text:
            text=text.replace(old_sub,new_sub,1)
          elif 'let bootHydrating = true;' not in text:
            raise SystemExit('subscriber de boot não corresponde ao contrato esperado')
          if old_start in text:
            text=text.replace(old_start,new_start,1)
          elif 'bootHydrating = false;' not in text:
            raise SystemExit('start() não corresponde ao contrato esperado')
          operator.write_text(text)

          auth=Path('app/auth-shell.js')
          auth_text=auth.read_text()
          if "await import('./operator-main.js');" in auth_text:
            auth_text=auth_text.replace("await import('./operator-main.js');","await import('./operator-main.js?v=6.2.1');",1)
          elif "await import('./operator-main.js?v=6.2.1');" not in auth_text:
            raise SystemExit('import P0 do operador não corresponde ao contrato esperado')
          auth.write_text(auth_text)
          PY

          cat > tests/e2e/single-hydration.spec.mjs <<'EOF'
          import { test,expect } from '@playwright/test';
          import { installForensicApi } from './support/forensic-api.mjs';

          test('boot do operador hidrata D1 e monta #app uma única vez',async({ page })=>{
            const errors=[];
            page.on('pageerror',error=>errors.push(error.message));
            await page.addInitScript(()=>{
              const descriptor=Object.getOwnPropertyDescriptor(Element.prototype,'innerHTML');
              const originalSet=descriptor?.set;
              if(!descriptor||!originalSet)return;
              window.__NEOMES_APP_WRITES=0;
              Object.defineProperty(Element.prototype,'innerHTML',{
                ...descriptor,
                set(value){
                  if(this.id==='app')window.__NEOMES_APP_WRITES=(window.__NEOMES_APP_WRITES||0)+1;
                  return originalSet.call(this,value);
                }
              });
            });
            await installForensicApi(page);
            await page.goto('/');
            await expect(page.getByText('TNL 091',{ exact:true }).first()).toBeVisible();
            await page.waitForFunction(()=>Boolean(window.__NEOMES_MODULE_BOOT));
            await page.waitForTimeout(900);
            expect(await page.evaluate(()=>window.__NEOMES_APP_WRITES)).toBe(1);
            expect(errors).toEqual([]);
          });
          EOF

          node --check app/operator-main.js
          node --check app/auth-shell.js
          node --check tests/e2e/single-hydration.spec.mjs

      - name: Check recovery module syntax
        run: |
          node --check app/machine-runtime.js
          node --check worker/machine-runtime.js

      - name: Run full interaction static forensics
        run: node tests/interaction-static-forensics.test.mjs

      - name: Run calculation and architecture regression
        run: npm run test:regression

      - name: Audit remote D1 catalog and assignment integrity
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          SUMMARY="$(npx --yes wrangler@4.68.0 d1 execute mes-operadores-db --remote --command "SELECT (SELECT COUNT(*) FROM production_lines WHERE active=1) AS active_lines, (SELECT COUNT(*) FROM machines WHERE active=1) AS active_machines, (SELECT COUNT(*) FROM operator_machine_assignments) AS assignments;" --json)"
          ORPHANS="$(npx --yes wrangler@4.68.0 d1 execute mes-operadores-db --remote --command "SELECT a.machine_id AS machine_id, COUNT(*) AS uses FROM operator_machine_assignments a LEFT JOIN machines m ON m.id=a.machine_id WHERE m.id IS NULL GROUP BY a.machine_id ORDER BY uses DESC, a.machine_id LIMIT 100;" --json)"
          SESSION_ORPHANS="$(npx --yes wrangler@4.68.0 d1 execute mes-operadores-db --remote --command "SELECT s.machine_id AS machine_id, COUNT(*) AS uses FROM shift_machine_sessions s LEFT JOIN machines m ON m.id=s.machine_id WHERE m.id IS NULL GROUP BY s.machine_id ORDER BY uses DESC, s.machine_id LIMIT 100;" --json)"

          printf '%s\n' "$SUMMARY"
          printf '%s\n' "$ORPHANS"
          printf '%s\n' "$SESSION_ORPHANS"

          node - "$SUMMARY" "$ORPHANS" "$SESSION_ORPHANS" <<'NODE'
          const [summaryRaw,orphansRaw,sessionOrphansRaw]=process.argv.slice(2);
          const rows=raw=>{
            const parsed=JSON.parse(raw);
            const result=Array.isArray(parsed)?parsed[0]:parsed;
            return result?.results || result?.result?.[0]?.results || [];
          };
          const summary=rows(summaryRaw)[0] || {};
          const orphans=rows(orphansRaw);
          const sessionOrphans=rows(sessionOrphansRaw);
          console.log('D1 audit summary:',summary);
          console.log('Assignment orphan machine IDs:',orphans);
          console.log('Session orphan machine IDs:',sessionOrphans);
          if(Number(summary.active_lines)!==10) throw new Error(`D1 possui ${summary.active_lines} linhas ativas; esperado 10.`);
          if(Number(summary.active_machines)!==136) throw new Error(`D1 possui ${summary.active_machines} máquinas ativas; esperado 136.`);
          if(orphans.length) throw new Error(`Existem atribuições com machine_id fora do catálogo: ${orphans.map(x=>x.machine_id).join(', ')}`);
          if(sessionOrphans.length) throw new Error(`Existem sessões com machine_id fora do catálogo: ${sessionOrphans.map(x=>x.machine_id).join(', ')}`);
          NODE

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: Prepare exact current main worktree
        run: |
          git fetch origin main
          rm -rf /tmp/neomes-main
          git worktree add --detach /tmp/neomes-main origin/main

      - name: Forensic WebKit comparison against current main
        env:
          NEOMES_E2E_ROOT: /tmp/neomes-main
          NEOMES_FORENSIC_MAIN: '1'
        run: npx playwright test tests/e2e/main-forensics.spec.mjs --retries=0

      - name: Run mobile WebKit behavior tests
        run: npm run test:e2e

      - name: Stress click integrity and ownership
        run: npx playwright test tests/e2e/click-integrity.spec.mjs tests/e2e/interaction-ownership.spec.mjs tests/e2e/mobile-workspace.spec.mjs tests/e2e/single-hydration.spec.mjs --repeat-each=3 --retries=0

      - name: Persist single hydration only after complete green gate
        if: success() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/operator-main.js app/auth-shell.js tests/e2e/single-hydration.spec.mjs
          if git diff --cached --quiet; then
            echo 'Hidratação única já está persistida.'
            exit 0
          fi
          git commit -m "fix: hidrata painel uma vez antes de renderizar"
          git push origin HEAD:agent/neomes-architecture-recovery

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: neomes-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
