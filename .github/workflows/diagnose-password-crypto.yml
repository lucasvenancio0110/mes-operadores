name: Diagnose password crypto

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-password-crypto.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consultar autoteste criptográfico
        id: request
        run: |
          set -euo pipefail
          URL='https://mes-operadores.lucassantanals0110.workers.dev/api/v1/auth/crypto-health'
          BODY_FILE="$(mktemp)"
          STATUS="$(curl --silent --show-error --output "$BODY_FILE" --write-out '%{http_code}' "$URL" || true)"
          cp "$BODY_FILE" /tmp/crypto-body.json
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Resposta HTTP: $STATUS"
          cat "$BODY_FILE"

      - name: Registrar diagnóstico
        env:
          HTTP_STATUS: ${{ steps.request.outputs.status }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          mkdir -p deployment
          node - <<'NODE'
          const fs = require('fs');
          let body = {};
          try { body = JSON.parse(fs.readFileSync('/tmp/crypto-body.json','utf8')); }
          catch { body = { raw: fs.readFileSync('/tmp/crypto-body.json','utf8') }; }
          fs.writeFileSync('deployment/crypto-diagnostic.json', JSON.stringify({
            checkedAt: new Date().toISOString(),
            httpStatus: Number(process.env.HTTP_STATUS || 0),
            response: body
          }, null, 2) + '\n');
          NODE
          git add deployment/crypto-diagnostic.json
          git diff --cached --quiet || git commit -m 'chore: registra diagnóstico criptográfico [skip ci]'
          git push origin HEAD:main
