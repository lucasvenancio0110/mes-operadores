name: Deploy NEOMES Pixi BETA

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neomes-pixi-beta-cloudflare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy-beta:
    name: Publicar preview Pixi somente leitura
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Baixar branch BETA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Confirmar commit da BETA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar preview e renderer
        run: |
          set -euo pipefail
          node --check worker/beta-preview.js
          node --check app/factory-map-pixi-adapter.js
          node --check app/factory-map-pixi-source.js
          test -s app/vendor/factory-map-pixi.bundle.js
          test -f wrangler.beta.jsonc
          node tests/factory-map-geometry-v6.test.mjs
          node tests/preparer-dashboard-v6.test.mjs

      - name: Verificar Cloudflare
        id: preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          test -n "$TOKEN"
          test -n "$ACCOUNT_ID"
          VERIFY="$(curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.success || x.result?.status!=="active") process.exit(1)' "$VERIFY"
          SUBDOMAIN_RESPONSE="$(curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/subdomain")"
          SUBDOMAIN="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.result?.subdomain || "")' "$SUBDOMAIN_RESPONSE")"
          test -n "$SUBDOMAIN"
          echo "subdomain=$SUBDOMAIN" >> "$GITHUB_OUTPUT"

      - name: Publicar Pixi BETA
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKERS_SUBDOMAIN: ${{ steps.preflight.outputs.subdomain }}
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          LOG="$RUNNER_TEMP/neomes-pixi-beta-deploy.log"
          npx --yes wrangler@4.68.0 deploy --config wrangler.beta.jsonc 2>&1 | tee "$LOG"
          URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$LOG" | tail -n 1 || true)"
          if [ -z "$URL" ]; then
            URL="https://mes-operadores-pixi-beta.$WORKERS_SUBDOMAIN.workers.dev"
          fi
          VERSION_ID="$(grep -Eo 'Current Version ID: [A-Za-z0-9-]+' "$LOG" | awk '{print $4}' | tail -n 1 || true)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"

      - name: Smoke do preview
        env:
          BETA_URL: ${{ steps.publish.outputs.url }}
        run: |
          set -euo pipefail
          HEALTH="$(curl --fail --silent --show-error "$BETA_URL/health")"
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.ok || x.service!=="neomes-pixi-beta" || x.mode!=="read-only-preview") process.exit(1)' "$HEALTH"
          INDEX="$(curl --fail --silent --show-error "$BETA_URL/")"
          printf '%s' "$INDEX" | grep -q 'factory-map-pixi-adapter.js'
          printf '%s' "$INDEX" | grep -q 'PIXI BETA'

          STATUS="$(curl --silent --show-error -o "$RUNNER_TEMP/write-block.json" -w '%{http_code}' -X POST "$BETA_URL/api/v1/machine-states" -H 'Content-Type: application/json' --data '{}')"
          test "$STATUS" = "423"
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(x.code!=="BETA_READ_ONLY") process.exit(1)' "$RUNNER_TEMP/write-block.json"

      - name: Resumo
        env:
          BETA_URL: ${{ steps.publish.outputs.url }}
          VERSION_ID: ${{ steps.publish.outputs.version_id }}
        run: |
          {
            echo '## NEOMES Pixi BETA publicado'
            echo
            echo "- Commit: $SOURCE_SHA"
            echo "- URL: $BETA_URL"
            echo "- Cloudflare Version ID: ${VERSION_ID:-n/a}"
            echo '- Modo: preview somente leitura para operações'
            echo '- Renderer Pixi selecionado por padrão neste ambiente'
          } >> "$GITHUB_STEP_SUMMARY"
