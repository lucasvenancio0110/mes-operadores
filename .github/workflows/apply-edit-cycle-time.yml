name: Apply editable cycle time

on:
  push:
    branches: [agent/edit-cycle-time-v2]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/edit-cycle-time-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar edição segura do tempo de ciclo
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Padrão não encontrado em {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # Frontend: expõe o ciclo apenas no fluxo "Atualizar dados" e usa o valor editado no payload.
          replace_once(
              'app/turn-assistant.js',
              "const VERSION = '6.0.1';",
              "const VERSION = '6.0.2';"
          )

          replace_once(
              'app/turn-assistant.js',
              """    <div class=\"ta-flow-copy\"><strong>${mode === 'update' ? 'Atualize somente o que mudou' : 'Assuma esta máquina em poucos passos'}</strong><span>A OP e os dados técnicos já estão carregados. Você só confirma a produção e informa o material.</span></div>\n    ${productionConfirmation(order)}\n    ${materialRequiredFields(mode === 'update' ? { currentBarPieces:order.currentBarPieces,feederBars:order.feederBars } : {})}\n""",
              """    <div class=\"ta-flow-copy\"><strong>${mode === 'update' ? 'Atualize somente o que mudou' : 'Assuma esta máquina em poucos passos'}</strong><span>A OP e os dados técnicos já estão carregados. Você só confirma a produção e informa o material.</span></div>\n    ${mode === 'update' ? `<section class=\"ta-confirm-block ta-cycle-edit\">\n      <div class=\"ta-block-heading\"><span>↻</span><div><strong>Tempo de ciclo da peça</strong><small>Edite quando o ciclo real da máquina mudar.</small></div></div>\n      <label class=\"ta-large-field\"><span>Tempo atual</span><input name=\"cycle\" required value=\"${escapeHtml(formatCycle(order.cycleSeconds))}\" placeholder=\"Ex.: 1:38\"><small>Aceita 1:38, 98 ou 1m38s. Ao salvar, o NEOMES recalcula meta e previsão.</small></label>\n    </section>` : ''}\n    ${productionConfirmation(order)}\n    ${materialRequiredFields(mode === 'update' ? { currentBarPieces:order.currentBarPieces,feederBars:order.feederBars } : {})}\n"""
          )

          replace_once(
              'app/turn-assistant.js',
              """  const currentBarPieces=asInteger(form.elements.currentBarPieces?.value);\n  const feederBars=asInteger(form.elements.feederBars?.value);\n  if(!Number.isFinite(productionConfirmed))return showError(form,'Confirme ou corrija a quantidade produzida.');\n  if(!Number.isFinite(currentBarPieces))return showError(form,'Informe quantas peças a barra atual ainda fará.');\n""",
              """  const currentBarPieces=asInteger(form.elements.currentBarPieces?.value);\n  const feederBars=asInteger(form.elements.feederBars?.value);\n  const cycleSeconds=flow?.mode==='update'?parseCycle(form.elements.cycle?.value):Number(order.cycleSeconds);\n  if(!Number.isFinite(productionConfirmed))return showError(form,'Confirme ou corrija a quantidade produzida.');\n  if(!(cycleSeconds>0))return showError(form,'Informe um tempo de ciclo válido.');\n  if(!Number.isFinite(currentBarPieces))return showError(form,'Informe quantas peças a barra atual ainda fará.');\n"""
          )

          replace_once(
              'app/turn-assistant.js',
              """    opTarget:order.opTarget,cycleSeconds:order.cycleSeconds,frequency1:order.frequency1,frequency2:order.frequency2,\n""",
              """    opTarget:order.opTarget,cycleSeconds,frequency1:order.frequency1,frequency2:order.frequency2,\n"""
          )

          # Worker: aceita ciclo novo para OP existente, atualiza o segmento aberto e devolve uma única fonte de verdade.
          replace_once(
              'worker/turn-assistant.js',
              """  const productionConfirmed = number(body.productionConfirmed);\n  const currentBarPieces = integer(body.currentBarPieces);\n  const feederBars = integer(body.feederBars);\n  if (productionConfirmed === null || productionConfirmed < 0) return json({ error:'Confirme a quantidade produzida.',code:'PRODUCTION_REQUIRED' },400);\n""",
              """  const productionConfirmed = number(body.productionConfirmed);\n  const currentBarPieces = integer(body.currentBarPieces);\n  const feederBars = integer(body.feederBars);\n  const requestedCycleSeconds = body.cycleSeconds === undefined ? null : number(body.cycleSeconds);\n  if (productionConfirmed === null || productionConfirmed < 0) return json({ error:'Confirme a quantidade produzida.',code:'PRODUCTION_REQUIRED' },400);\n  if (body.cycleSeconds !== undefined && !(requestedCycleSeconds > 0)) return json({ error:'Informe um tempo de ciclo válido.',code:'CYCLE_REQUIRED' },400);\n"""
          )

          replace_once(
              'worker/turn-assistant.js',
              """  const previous = await activeOrder(env,machineId);\n  const order = previous || {\n    machineId,lineId,lineName:text(body.lineName),machineName:text(body.machineName),\n    op:text(body.op),item:text(body.item),description:text(body.description),opTarget:number(body.opTarget),\n    cycleSeconds:number(body.cycleSeconds),frequency1:number(body.frequency1),frequency2:number(body.frequency2),\n    pieceLengthMm:number(body.pieceLengthMm),producedSoFar:productionConfirmed,\n    currentBarPieces,feederBars,barLengthMm:number(body.barLengthMm) || DEFAULT_BAR_LENGTH_MM,\n    kerfMm:number(body.kerfMm) ?? DEFAULT_KERF_MM,status:'active',openedAt:nowIso()\n  };\n""",
              """  const previous = await activeOrder(env,machineId);\n  const effectiveCycleSeconds = requestedCycleSeconds > 0 ? requestedCycleSeconds : number(previous?.cycleSeconds);\n  const order = previous ? { ...previous,cycleSeconds:effectiveCycleSeconds } : {\n    machineId,lineId,lineName:text(body.lineName),machineName:text(body.machineName),\n    op:text(body.op),item:text(body.item),description:text(body.description),opTarget:number(body.opTarget),\n    cycleSeconds:effectiveCycleSeconds,frequency1:number(body.frequency1),frequency2:number(body.frequency2),\n    pieceLengthMm:number(body.pieceLengthMm),producedSoFar:productionConfirmed,\n    currentBarPieces,feederBars,barLengthMm:number(body.barLengthMm) || DEFAULT_BAR_LENGTH_MM,\n    kerfMm:number(body.kerfMm) ?? DEFAULT_KERF_MM,status:'active',openedAt:nowIso()\n  };\n  const cycleChanged = Boolean(previous && requestedCycleSeconds > 0 && Math.abs(Number(previous.cycleSeconds)-requestedCycleSeconds) > 0.0001);\n"""
          )

          replace_once(
              'worker/turn-assistant.js',
              """  ];\n  if (!existingOpen) {\n    statements.push(env.DB.prepare(`INSERT INTO machine_turn_segments (\n""",
              """  ];\n  if (existingOpen && cycleChanged) {\n    statements.push(env.DB.prepare(`UPDATE machine_turn_segments\n      SET cycle_time_seconds=?,updated_at=? WHERE id=?`).bind(order.cycleSeconds,now,existingOpen.id));\n  }\n  if (!existingOpen) {\n    statements.push(env.DB.prepare(`INSERT INTO machine_turn_segments (\n"""
          )

          replace_once(
              'worker/turn-assistant.js',
              """  await writeEvent(env,request,access.auth,body,'turn.handoff_confirmed',{ productionConfirmed,currentBarPieces,feederBars,segmentId });\n""",
              """  await writeEvent(env,request,access.auth,body,'turn.handoff_confirmed',{\n    productionConfirmed,currentBarPieces,feederBars,segmentId,cycleSeconds:order.cycleSeconds,\n    previousCycleSeconds:previous?.cycleSeconds ?? null,cycleChanged\n  });\n"""
          )

          # Cache-bust do módulo no HTML para o Safari não reaproveitar o JS anterior.
          p = Path('index.html')
          text = p.read_text()
          if 'turn-assistant.js?v=6.0.1' not in text:
              raise SystemExit('Versão 6.0.1 do turn-assistant não encontrada no index.html')
          p.write_text(text.replace('turn-assistant.js?v=6.0.1','turn-assistant.js?v=6.0.2'))

          # Atualiza apenas expectativas de versão e adiciona contratos específicos da edição de ciclo.
          for test_path in Path('tests').glob('*.mjs'):
              text = test_path.read_text()
              text = text.replace('turn-assistant.js?v=6.0.1','turn-assistant.js?v=6.0.2')
              text = text.replace('NEOMES 6.0.1:', 'NEOMES 6.0.2:')
              test_path.write_text(text)

          p = Path('tests/turn-assistant.test.mjs')
          text = p.read_text()
          anchor = "assert(assistant.includes(\"post('/api/v1/turn-assistant/handoff',body)\"),'Persistência da passagem de turno não está conectada.');\n"
          addition = anchor + "assert(assistant.includes('Tempo de ciclo da peça'),'Atualizar dados não oferece edição do tempo de ciclo.');\nassert(assistant.includes(\"flow?.mode==='update'?parseCycle(form.elements.cycle?.value)\"),'O ciclo editado não é validado pelo parser oficial.');\nassert(assistant.includes('opTarget:order.opTarget,cycleSeconds,frequency1'),'O ciclo editado não entra no payload da OP ativa.');\n"
          if anchor not in text:
              raise SystemExit('Âncora do teste frontend não encontrada')
          p.write_text(text.replace(anchor, addition, 1))

          p = Path('tests/turn-assistant-worker-v6.test.mjs')
          text = p.read_text()
          anchor = "assert(worker.includes('calculatePointingAccounting'),'API não usa a mesma contabilidade lógica validada no frontend.');\n"
          addition = anchor + "assert(worker.includes('requestedCycleSeconds'),'Worker não aceita edição do ciclo em OP ativa.');\nassert(worker.includes('cycleChanged = Boolean(previous'),'Worker não detecta alteração real do ciclo.');\nassert(worker.includes('SET cycle_time_seconds=?,updated_at=? WHERE id=?'),'Segmento aberto não recebe o novo ciclo.');\nassert(worker.includes('previousCycleSeconds:previous?.cycleSeconds ?? null,cycleChanged'),'Alteração do ciclo não fica auditável no evento da conferência.');\n"
          if anchor not in text:
              raise SystemExit('Âncora do teste Worker não encontrada')
          p.write_text(text.replace(anchor, addition, 1))
          PY

      - name: Validar sintaxe
        run: |
          node --check app/turn-assistant.js
          node --check worker/turn-assistant.js

      - name: Rodar suíte operacional
        run: |
          node tests/static-check.mjs
          node tests/password-migration.test.mjs
          node tests/measurement-plan.test.mjs
          node tests/conference-ux.test.mjs
          node tests/shift-performance.test.mjs
          node tests/shift-time.test.mjs
          node tests/turn-assistant.test.mjs
          node tests/turn-flow-v6.test.mjs
          node tests/turn-assistant-worker-v6.test.mjs
          node tests/operator-flow-v6.test.mjs
          node tests/preparer-dashboard-v6.test.mjs
          node tests/workflow-gate-v6.test.mjs

      - name: Commitar somente a atualização final
        run: |
          rm -f .github/workflows/apply-edit-cycle-time.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: permite editar tempo de ciclo da OP ativa"
          git push origin HEAD:agent/edit-cycle-time-v2
