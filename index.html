<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070b13">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="NEODENT MES — aplicativo industrial para conferência de máquinas CNC, planejamento manual e fechamento da produção do turno.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NEODENT MES">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>NEODENT MES</title>
  <link rel="manifest" href="manifest.webmanifest?v=3.4.0">
  <link rel="icon" href="icons/mes-icon.svg?v=3.4.0" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/mes-icon.svg?v=3.4.0">
  <link rel="stylesheet" href="app/app.css?v=3.4.0">
  <link rel="stylesheet" href="app/operator.css?v=3.4.0">
  <link rel="stylesheet" href="app/premium.css?v=3.4.0">
  <link rel="stylesheet" href="app/premium-runtime.css?v=3.4.0">
  <link rel="stylesheet" href="app/planning.css?v=3.4.0">
  <link rel="stylesheet" href="app/measurement-plan.css?v=3.4.0">
  <style>
    .boot{min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(70% 45% at 50% 20%,rgba(77,101,151,.17),transparent 70%),#070b13;color:#f4f7fb;font-family:Inter,system-ui,sans-serif}.boot-card{display:grid;justify-items:center;width:min(100%,330px);text-align:center}.boot-logo{width:82px;height:82px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.42));animation:bootMark .55s cubic-bezier(.22,.72,.28,1) both}.boot strong{display:block;margin-top:20px;font-size:1.3rem;letter-spacing:.08em}.boot span{display:block;margin-top:7px;color:#8794a7;font-size:.76rem}.boot i{display:block;width:132px;height:3px;margin:22px auto 0;overflow:hidden;border-radius:99px;background:#1b2636}.boot i::after{content:'';display:block;width:42%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#b82f7f,#e052a5);animation:load .9s infinite}@keyframes bootMark{from{opacity:0;transform:translateY(8px) scale(.92)}to{opacity:1;transform:none}}@keyframes load{from{transform:translateX(-120%)}to{transform:translateX(350%)}}@media(prefers-reduced-motion:reduce){.boot-logo,.boot i::after{animation:none}.boot i::after{width:100%}}
  </style>
</head>
<body>
  <div id="app"><div class="boot" role="status" aria-live="polite"><div class="boot-card"><img class="boot-logo" src="icons/neomes-mark.svg" alt=""><strong>NEODENT MES</strong><span>Preparando seu turno</span><i></i></div></div></div>
  <div id="layers"></div>
  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <noscript><div class="boot"><div class="boot-card"><img class="boot-logo" src="icons/neomes-mark.svg" alt=""><strong>JavaScript necessário</strong><span>Ative o JavaScript para utilizar o aplicativo.</span></div></div></noscript>
  <script type="module" src="app/operator-main.js?v=3.4.0"></script>
  <script type="module" src="app/cloud-state.js?v=3.4.0"></script>
  <script type="module" src="app/exports.js?v=3.4.0"></script>
  <script type="module" src="app/premium-runtime.js?v=3.4.0"></script>
  <script type="module" src="app/production-planning.js?v=3.4.0"></script>
  <script type="module" src="app/measurement-plan.js?v=3.4.0"></script>
</body>
</html>
