<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090d17">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="NEODENT Manufacturing Execution System para acompanhamento operacional de máquinas CNC, produção, Andon e turnos.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NEODENT MES">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>NEODENT MES</title>
  <link rel="manifest" href="/manifest.webmanifest?v=3.0.1">
  <link rel="icon" href="/icons/mes-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/mes-icon.svg">
  <link rel="stylesheet" href="/app/app.css?v=3.0.1">
  <style>
    .boot{min-height:100dvh;display:grid;place-items:center;padding:24px;background:#090d17;color:#f5f7fb;font-family:system-ui,sans-serif}.boot div{text-align:center}.boot strong{display:block;font-size:1.5rem;letter-spacing:.07em}.boot span{display:block;margin-top:8px;color:#a7b0bf}.boot i{display:block;width:140px;height:3px;margin:20px auto 0;overflow:hidden;border-radius:99px;background:#202a39}.boot i::after{content:'';display:block;width:40%;height:100%;background:#d9469b;animation:load .9s infinite}@keyframes load{from{transform:translateX(-120%)}to{transform:translateX(350%)}}@media(prefers-reduced-motion:reduce){.boot i::after{animation:none;width:100%}}
  </style>
</head>
<body>
  <div id="app"><div class="boot" role="status" aria-live="polite"><div><strong>NEODENT MES</strong><span>Carregando central operacional…</span><i></i></div></div></div>
  <div id="layers"></div>
  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <noscript><div class="boot"><div><strong>JavaScript necessário</strong><span>Ative o JavaScript para utilizar o sistema.</span></div></div></noscript>
  <script type="module" src="/app/main.js?v=3.0.1"></script>
  <script type="module" src="/app/cloud-state.js?v=3.0.1"></script>
  <script type="module" src="/app/runtime.js?v=3.0.1"></script>
</body>
</html>
