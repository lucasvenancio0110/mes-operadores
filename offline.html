<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070b13">
  <title>NEOMES · Offline</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#070b13;color:#f5f7fb}
    *{box-sizing:border-box}
    body{min-height:100dvh;margin:0;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));background:radial-gradient(circle at 50% 0,rgba(175,36,157,.12),transparent 42%),#070b13}
    main{width:min(100%,480px);padding:28px;border:1px solid #2b3545;border-radius:24px;background:#111927;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.35)}
    img{display:block;width:auto;height:72px;max-width:220px;margin:0 auto 22px;object-fit:contain}
    strong{display:block;font-size:1.5rem;letter-spacing:.1em}
    p{margin:12px 0 24px;color:#a7b0bf;line-height:1.55}
    button{min-height:48px;padding:0 20px;border:0;border-radius:14px;background:#af249d;color:#fff;font-weight:800}
  </style>
</head>
<body><main><img src="assets/brand/neomes-logo-horizontal.svg" width="816" height="272" alt="NEOMES"><strong>SEM CONEXÃO</strong><p>Os dados já salvos neste aparelho continuam disponíveis. Abra novamente o aplicativo; os registros pendentes serão sincronizados quando a internet voltar.</p><button onclick="location.href='./'">Tentar novamente</button></main></body>
</html>
